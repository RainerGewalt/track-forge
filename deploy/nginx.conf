server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /local-ca.crt {
        alias /etc/nginx/certs/local-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="strudel-lan-player-ca.crt"';
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/player.crt;
    ssl_certificate_key /etc/nginx/certs/player.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PlayerTLS:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    # The listening player is the landing page; the studio stays at /index.html.
    index player.html index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://source-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /player.html;
    }

    location ~* \.(?:css|js|mjs|wasm|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /samples/ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }
}
