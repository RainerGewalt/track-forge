name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pieces:validate
      - run: npm test
      - run: npm run build

  # L4 browser scenarios in headless Chrome, which the runner has
  # preinstalled (docs/TESTING.md).
  browser-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
